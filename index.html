<!doctype html>
<html lang="en">
<head>
  <script>
    // Prevent flash of light theme — dark is the default
    (function(){
      var t = localStorage.getItem('cents-theme');
      if (t !== 'light') document.documentElement.dataset.theme = 'dark';
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="cents. - a calm, precise personal expense tracker. Track spending, budgets, balances and recurring bills." />
  <meta name="theme-color" content="#101210" />
  <script>
    // Keep browser chrome (scrollbars, address bar, status bar) in sync with
    // the app theme — light mode should not leave dark chrome behind.
    (function () {
      var schemeMeta = document.querySelector('meta[name="color-scheme"]');
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      function syncChrome() {
        var dark = document.documentElement.dataset.theme === 'dark';
        if (schemeMeta) schemeMeta.content = dark ? 'dark' : 'light';
        if (themeMeta) themeMeta.content = dark ? '#101210' : '#F5F5F2';
      }
      syncChrome();
      new MutationObserver(syncChrome).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="cents." />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>cents. - personal expense tracker</title>
  <!-- Ledger Mark favicon: the open c and double ledger lines echo the header logo. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101110'/%3E%3Cpath d='M23 8.5a9.3 9.3 0 1 0 0 15' fill='none' stroke='%2335B877' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M3.5 10.5h12M3.5 21.5h12' fill='none' stroke='%23E8EBE5' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <!-- PWA: manifest + install icons make an added-to-homescreen copy open
       standalone (no browser chrome) on Android Chrome and iOS Safari. -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />

  <script>
    // Register the service worker immediately — before the app bundle is even
    // fetched — so Chrome can mark the site installable the moment the page
    // starts loading instead of waiting for the 344 KB app.js to download and
    // run. Silent failure: the app works with or without SW support.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  </script>

  <!-- Fonts are self-hosted in /fonts (see the @font-face rules in styles.css)
       so the app makes no third-party connection on load. -->
  <link rel="stylesheet" href="styles.css">

  <!-- Critical-path preloads: kick off the big module download and the main
       UI font in parallel with the render-blocking stylesheet instead of
       waiting for the parser to reach the bottom of the body. app.js uses
       modulepreload (not preload) so its fetch matches the module script's
       credentials mode — a plain preload would be orphaned and downloaded
       twice. -->
  <link rel="modulepreload" href="app.js" />
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- ============================================================
       Self-diagnostic — runs BEFORE the module script.
       If app.js fails to load, parse, or initialize, this paints a
       styled "blank-page" panel with concrete next steps instead of
       dead air. The build marker lets you verify which deploy you got.
       ============================================================ -->
  <script>
    (function () {
      // Capture the most recent error so we can show it inline if the module fails.
      window.__centsLastError = '';
      window.addEventListener('error', function (ev) {
        try {
          var src = ev.filename || ev.sourceURL || '(unknown source)';
          var line = ev.lineno != null ? (':' + ev.lineno + (ev.colno != null ? ':' + ev.colno : '')) : '';
          var msg  = (ev.error && (ev.error.stack || ev.error.message)) || ev.message || 'unknown';
          window.__centsLastError = src + line + '  ' + msg;
          if (window.__centsLastError.length > 1200) window.__centsLastError = window.__centsLastError.slice(0, 1200);
        } catch (e) {}
      });
      window.addEventListener('unhandledrejection', function (ev) {
        try {
          var r = ev.reason;
          var detail;
          if (r && r.message) detail = r.stack || r.message;
          else if (typeof r === 'string') detail = r;
          else if (r != null) { try { detail = JSON.stringify(r); } catch (e) { detail = String(r); } }
          else detail = 'unknown rejection';
          window.__centsLastError = 'unhandledrejection: ' + detail;
          if (window.__centsLastError.length > 1200) window.__centsLastError = window.__centsLastError.slice(0, 1200);
        } catch (e) {}
      });
      // Known-fast-path: file:// cannot run ES modules at all (browser security
      // model). Show the file-specific message in 250ms instead of waiting
      // 2.5s for the dual-signal check to elapse.
      var isFileProtocol = location.protocol === 'file:';
      var waitMs = isFileProtocol ? 250 : 2500;
      setTimeout(function () {
        // Runtime error during render: app.js loaded, partial render happened, but a screen or
        // a later step threw. In this case the header is visible (`mount.children.length > 0`)
        // but the body is blank, and clicks keep retriggering `render()` → same throw → still
        // only the header. The original boot-fail logic muted itself in this exact situation;
        // surface the captured error now so the user has something to react to.
        if (window.__cents && window.__centsLastError) {
          var errPanel = document.getElementById('boot-fail');
          if (errPanel && errPanel.hidden) {
            errPanel.removeAttribute('hidden');
            errPanel.innerHTML = '<div class="bf-card">' +
              '<div class="bf-mark">cents.</div>' +
              '<h1>Render error.</h1>' +
              '<div class="bf-err"><span>Last error captured</span><code>' + escapeHtml(window.__centsLastError) + '</code></div>' +
              '<p>JavaScript loaded but rendering threw. The header is up but the body never finished. Every click on a nav link re-runs <code>render()</code> and re-hits the same throw.</p>' +
              '<ol><li>Hard refresh - <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> &nbsp;/&nbsp; macOS: <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></li></ol>' +
              '</div>';
          }
          return;
        }
        // Two signals must hold before we conclude boot failure:
        //   (a) app.js never set window.__cents, AND
        //   (b) the app mount is still empty (render() never ran either).
        // Either alone is a false positive risk on slow networks.
        if (window.__cents) return;
        var mount = document.getElementById('app');
        if (mount && mount.children && mount.children.length > 0) return;
        var panel = document.getElementById('boot-fail');
        if (!panel) return;
        panel.hidden = false;
        var err = window.__centsLastError
          ? '<div class="bf-err"><span>Last error captured</span><code>' + escapeHtml(window.__centsLastError) + '</code></div>'
          : '';
        // Two different messages: one for the file:// case (almost certainly
        // the actual cause), one for the http(s) case (could be stale cache,
        // a Netlify deploy missing files, etc.).
        var headline, blurb, steps;
        if (isFileProtocol) {
          headline = 'App can&rsquo;t run from <code>file://</code>.';
          blurb = 'Browsers block ES-module imports over the <code>file://</code> protocol for security. You opened this page by double-clicking <code>index.html</code> instead of running a local web server.';
          steps =
            '<ol>' +
              '<li>Open a terminal in this directory (the one containing <code>index.html</code>).</li>' +
              '<li>Run: <code>./serve.sh</code> &nbsp;(or on Windows native cmd: <code>serve.bat</code>). It picks the first available static server and prints its URL.</li>' +
              '<li>Open that URL in your browser - default is <a href="http://localhost:8080/">http://localhost:8080/</a> if you didn&rsquo;t pass a port.</li>' +
            '</ol>';
        } else {
          headline = 'App didn&rsquo;t start.';
          blurb = 'The JavaScript module did not finish loading or initializing. Most often this is a stale browser cache or a Netlify deploy that&rsquo;s missing files.';
          steps =
            '<ol>' +
              '<li>Hard refresh - <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> &nbsp;/&nbsp; macOS: <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></li>' +
              '<li>If still blank: DevTools (<kbd>F12</kbd>) &rarr; <strong>Console</strong>. The first red line is the real cause - paste it back if you need help.</li>' +
              '<li>If you just redeployed: Netlify dashboard &rarr; <strong>Deploys</strong> &rarr; <em>Trigger deploy</em> &rarr; tick <strong>Clear cache and deploy</strong>.</li>' +
            '</ol>';
        }
        panel.innerHTML =
          '<div class="bf-card">' +
            '<div class="bf-mark">cents.</div>' +
            '<h1>' + headline + '</h1>' +
            err +
            '<p>' + blurb + '</p>' +
            steps +
          '</div>';
      }, waitMs);
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }
    })();
  </script>

  <style>
    #boot-fail { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; background: #F5F5F2; font-family: 'Space Grotesk', system-ui, sans-serif; color: #161712; z-index: 9999; }
    #boot-fail[hidden] { display: none; }
    #boot-fail .bf-card { max-width: 560px; padding: 36px 40px; border: 1px solid #E3E3DC; border-radius: 10px; background: #fff; line-height: 1.55; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
    #boot-fail .bf-mark { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; color: #161712; }
    #boot-fail .bf-mark::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 1px; background: #157A4A; vertical-align: 2px; }
    #boot-fail h1 { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 600; font-size: 28px; margin: 6px 0 10px; }
    #boot-fail ol { padding-left: 22px; margin: 12px 0 0; }
    #boot-fail li { margin-bottom: 10px; }
    #boot-fail kbd { background: #ECECE7; padding: 2px 7px; border-radius: 4px; border: 1px solid #E3E3DC; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    #boot-fail code { background: #ECECE7; padding: 2px 7px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6E6E67; }
    #boot-fail .bf-err { margin: 14px 0 18px; padding: 12px 14px; background: #E9F2EC; border: 1px solid #BFD6C9; border-radius: 8px; font-size: 12px; }
    #boot-fail .bf-err span { color: #6E6E67; font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 600; }
    #boot-fail .bf-err code { display: block; margin-top: 6px; font-size: 11px; word-break: break-word; white-space: pre-wrap; line-height: 1.4; background: transparent; padding: 0; }
    /* Dark mode overrides */
    [data-theme="dark"] #boot-fail { background: #101210; color: #E8EBE5; }
    [data-theme="dark"] #boot-fail .bf-card { background: #171A17; border-color: #272B26; box-shadow: 0 8px 26px rgba(0,0,0,0.5); }
    [data-theme="dark"] #boot-fail .bf-mark { color: #E8EBE5; }
    [data-theme="dark"] #boot-fail .bf-mark::after { background: #35B877; }
    [data-theme="dark"] #boot-fail kbd { background: #161916; border-color: #272B26; }
    [data-theme="dark"] #boot-fail code { background: #161916; color: #8C928A; }
    [data-theme="dark"] #boot-fail .bf-err { background: #1C2A20; border-color: #2E3D33; }
    [data-theme="dark"] #boot-fail .bf-err span { color: #8C928A; }
  </style>
</head>
<body>
  <noscript>
    <div style="padding:32px;font-family:'Space Grotesk',system-ui,sans-serif;">This app needs JavaScript enabled to run.</div>
  </noscript>
  <div id="app"></div>
  <!-- Instant splash: paints the cents. mark with zero network requests while
       the 370 KB module downloads, so a cold mobile open never stares at a
       blank screen. Removed as soon as the app's first render lands (or the
       boot-fail panel appears, or after a hard backstop). -->
  <div id="splash" aria-hidden="true">
    <!-- Draw-on: the ledger mark writes itself once on startup — the C sweeps
         around, the two balance lines draw in left-to-right, then the wordmark
         settles beneath. Plays one shot and holds (the splash is removed the
         moment the app boots). Reduced-motion users get the finished mark. -->
    <div class="splash-mark">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path class="c"  pathLength="1" d="M23 8.5a9.3 9.3 0 1 0 0 15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        <path class="l1" pathLength="1" d="M3.5 10.5h12" stroke="var(--splash-line)" stroke-width="2.6" stroke-linecap="round" />
        <path class="l2" pathLength="1" d="M3.5 21.5h12" stroke="var(--splash-line)" stroke-width="2.6" stroke-linecap="round" />
      </svg>
    </div>
    <div class="splash-name">cents<span class="splash-dot">.</span></div>
    <style>
      #splash { --splash-line: #E8EBE5; position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #101210; color: #35B877; }
      #splash .splash-mark { width: 52px; height: 52px; }
      #splash .splash-mark svg { width: 100%; height: 100%; display: block; }
      #splash .splash-mark path { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      #splash .splash-mark .c   { animation: splash-draw-c  .7s cubic-bezier(0.3, 0.7, 0.4, 1) forwards; }
      #splash .splash-mark .l1  { animation: splash-draw-l1 .28s cubic-bezier(0.3, 0.7, 0.4, 1) .7s forwards; }
      #splash .splash-mark .l2  { animation: splash-draw-l2 .28s cubic-bezier(0.3, 0.7, 0.4, 1) .84s forwards; }
      #splash .splash-name { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; color: #E8EBE5; opacity: 0; animation: splash-name-in .45s ease .98s forwards; }
      #splash .splash-dot { color: #35B877; }
      @keyframes splash-draw-c  { to { stroke-dashoffset: 0; } }
      @keyframes splash-draw-l1 { to { stroke-dashoffset: 0; } }
      @keyframes splash-draw-l2 { to { stroke-dashoffset: 0; } }
      @keyframes splash-name-in { to { opacity: 1; } }
      [data-theme="light"] #splash { --splash-line: #161712; background: #F5F5F2; color: #157A4A; }
      [data-theme="light"] #splash .splash-name { color: #161712; }
      [data-theme="light"] #splash .splash-dot { color: #157A4A; }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark path { stroke-dashoffset: 0; animation: none; }
        #splash .splash-name { opacity: 1; animation: none; }
      }
    </style>
  </div>
  <script>
    // Remove the splash the moment the app is in control: app.js sets
    // window.__centsBooted in its DOMContentLoaded handler (the lock and
    // onboarding overlays mount on <body>, not #app, so 'mount has children'
    // alone can't signal readiness). The boot-fail panel and a hard backstop
    // guarantee it can never trap the user.
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var mount = document.getElementById('app');
      var bootFail = document.getElementById('boot-fail');
      var removed = false;
      function hide() {
        if (removed) return;
        removed = true;
        splash.style.transition = 'opacity 0.25s ease';
        splash.style.opacity = '0';
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 260);
      }
      function check() {
        if (removed) return;
        if (window.__centsBooted) return hide();
        if (mount && mount.children.length > 0) return hide();
        if (bootFail && !bootFail.hidden) return hide();
        setTimeout(check, 120);
      }
      check();
      setTimeout(hide, 10000);
    })();
  </script>
  <div id="boot-fail" hidden></div>
  <!-- No vendor script is loaded eagerly. Every library — SweetAlert2
       included — is fetched lazily on first use from app.js (swalConfirm
       waits for the 49 KB script, falling back to native confirm() only if
       the download itself fails), so the boot critical path is just
       styles.css + app.js and the module's tiny static imports. All
       integrations degrade gracefully. -->
  <script type="module" src="app.js"></script>
</body>
</html>
