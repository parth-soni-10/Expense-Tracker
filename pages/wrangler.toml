# Control config for this repository's Pages mirror.
#
# It lives in the repository now so CI can deploy the mirror the way the local
# deploy script did: `wrangler pages deploy` run from this directory takes the
# project name, its bindings and its vars from here, and `pages_build_output_dir`
# names the upload that tools/deploy-pages.mjs stages.
#
# The mirror's secrets (the VAPID keys, the profile passwords, GITHUB_TOKEN) are
# not in this file and cannot be: they are set out of band with
# Misc/pages-secrets.py, and a deploy does not clear them.

name = "cents-app"
pages_build_output_dir = "../.pages-dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The same KV namespace the Worker keeps profiles and sync state in.
[[kv_namespaces]]
binding = "CENTS_KV"
id = "b07228078d274906ab86bbb9a7cd07f4"

[vars]
REPO_OWNER = "parth-soni-10"
REPO_NAME = "cents-data"
REPO_BRANCH = "main"
REPO_FILE = "data.json"
