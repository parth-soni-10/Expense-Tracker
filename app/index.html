<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="cents. is a private expense tracker for budgets, balances, and recurring bills. Your ledger stays on your device unless you choose optional cloud sync." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#F5F5F2" />
  <title>cents. — expense tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <!-- Theme before first paint, from an external file: style-src is 'self' and
       script-src is 'self', so this document carries no inline script, no
       inline <style> and no style="" attribute anywhere. -->
  <script src="theme-init.js"></script>
  <script src="boot-watch.js"></script>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/screens.css" />
  <!-- The dashboard's three Hairline figures: the kernel, the mount that gives a
       figure its card, then one file per figure. Classic deferred scripts, in
       that order, so they have registered by the time the bundle renders — the
       same five files the shipping app loads, copied verbatim.

       The UI kit is the second module script: it scans the document and follows
       re-renders, which is how the shipping app mounts it. Both are external
       files because script-src is 'self' and this document carries no inline
       script, no inline <style> and no style="" attribute. -->
  <script src="hairline/kernel.js" defer></script>
  <script src="hairline/mount.js" defer></script>
  <script src="hairline/balance-tide.js" defer></script>
  <script src="hairline/envelope-garden.js" defer></script>
  <script src="hairline/receipt-constellation.js" defer></script>
  <script type="module" src="dist/main.js"></script>
  <script type="module" src="ui.js"></script>
</head>
<body>
  <button type="button" id="skip-to-main" class="skip-link">Skip to main content</button>
  <div id="app" class="app-shell" hidden>
    <header class="app-header">
      <span class="app-brand serif">cents.</span>
      <nav id="app-nav" class="app-nav" aria-label="Screens"></nav>
    </header>
    <main id="screen" class="app-screen" tabindex="-1"></main>
    <p class="app-foot muted" id="app-foot"></p>
  </div>
  <div id="gate" class="gate"></div>
  <div id="boot-fail" class="boot-fail" hidden>
    <div class="boot-card">
      <p class="boot-mark serif">cents.</p>
      <h1 class="boot-title">App didn&rsquo;t start.</h1>
      <p class="muted">The module did not finish loading. Hard refresh, then read the first red line in the console.</p>
    </div>
  </div>
  <noscript><p class="noscript">cents. needs JavaScript enabled to run.</p></noscript>
</body>
</html>
