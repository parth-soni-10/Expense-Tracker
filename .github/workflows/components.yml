# Cents, checked against the design system's manifest on every push.
#
# The manifest declares which of the 27 components Cents renders on which route,
# and a floor for each. Those are claims about *this* repository, so the commit
# that can falsify one is a commit here — deleting a card, or moving a control
# into a route the manifest does not know about. Nothing in this repo can check
# them, and the check used to be a manual run: `COMPONENT_BASE_URL=… npm run
# verify:components -- --site cents`.
#
# So the job is the design system's, invoked from here: it checks out this
# repository at the pushed commit, checks out design-system beside it, serves the
# app under its real `_headers` (the CSP included — the boot script is hash-pinned
# and does not run without it), and runs the verifier against that server.
#
# Setup this needs, once: `design-system` must exist at
# github.com/<owner>/design-system and be readable by this repository's token —
# i.e. public, or private with a PAT. The owner is not hard-coded: a reusable
# workflow resolves `<owner>` from `github.repository_owner` at run time.
name: components

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cents:
    uses: parth-soni-10/design-system/.github/workflows/components.yml@main
    with:
      site: cents
      design-system-ref: main
