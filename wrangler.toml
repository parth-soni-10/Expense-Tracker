# Bundle input for this site's Pages build — NOT a deployment.
#
# The Cloudflare Pages project runs, as its build command:
#
#   npx --yes wrangler@4 deploy --dry-run --outdir .pages-bundle
#   && node tools/deploy-pages.mjs --assets . --bundle .pages-bundle --out .pages-dist
#   && sed -i … .pages-dist/_worker.js        (bare node builtins → node:…)
#
# and this file is read for the first half of that only: `--dry-run` bundles
# `main` below into the worker.js that tools/deploy-pages.mjs stages as the
# project's `_worker.js`. Nothing is deployed from here, and nothing should be —
# this site has one host, the Pages project. A `wrangler deploy` run in this
# directory would publish a second copy of the same code to a workers.dev
# hostname nobody links to, now against the same production KV.
#
# Everything the deployed site needs lives where the deploy reads it:
# `pages/wrangler.toml` carries the project name, its CENTS_KV binding and its
# vars; its secrets (the app passwords, the VAPID pair, GITHUB_TOKEN) are set on
# the project and are not in this repository at all. `_headers` carries the
# response headers.
#
# Not published: `.assetsignore` lists this file, so it is never uploaded.

name = "cents-app"
main = "worker.js"
compatibility_date = "2026-10-01"

# Everything the functions use from Node: node:crypto (createECDH / createSign /
# createCipheriv for the VAPID pair, the payload encryption and the recovery
# tokens), Buffer, and the process.env object the config loop writes into. This
# is also what tells wrangler to leave a node builtin as a `node:` external while
# bundling, which is the form the deployed runtime expects — and what the build
# command's sed step exists to normalise.
compatibility_flags = ["nodejs_compat"]
