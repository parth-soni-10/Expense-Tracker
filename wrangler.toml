# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages dev .           → local test on http://localhost:8788
#   npx wrangler pages deploy          → publish .pages-dist to the project
#
# There is no Worker config and no Worker. The function half of the site — the
# five endpoints under /api/* and their pre-rename /.netlify/functions/*
# spelling — is a Pages Function: `functions/[[path]].js` catches every request
# and hands it to `functions/_router.js`, which routes it to the module under
# netlify/functions/ that answers it. Pages compiles those files as part of the
# deploy, so nothing is bundled here, there is no `_worker.js` to stage, and
# `wrangler deploy` is not a command this repository has any use for.
#
# Everything the deployed site needs is in this file or on the project:
# `pages_build_output_dir` names the upload tools/deploy-pages.mjs stages, the
# CENTS_KV binding below is the durable store, `[vars]` holds the non-secret
# coordinates, and the secrets (the app passwords, the VAPID pair, GITHUB_TOKEN)
# are set on the project and are not in this repository at all. `_headers`
# carries the response headers.

name = "cents-app"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# Everything the functions use from Node: node:crypto (createECDH / createSign /
# createCipheriv for the VAPID pair, the payload encryption and the recovery
# tokens), Buffer, and the process.env object the config loop writes into. Pages
# compiles functions/ with this flag, so those builtins are left as `node:`
# externals in the deployment.
compatibility_flags = ["nodejs_compat"]

# The KV namespace every profile's cloud document, its sync state and its push
# subscriptions live in — the only copy.
[[kv_namespaces]]
binding = "CENTS_KV"
id = "b07228078d274906ab86bbb9a7cd07f4"

[vars]
# The private GitHub repo the cloud document is mirrored into: a spare copy,
# never the commit point. The token that writes it is a secret.
REPO_OWNER = "parth-soni-10"
REPO_NAME = "cents-data"
REPO_BRANCH = "main"
REPO_FILE = "data.json"
