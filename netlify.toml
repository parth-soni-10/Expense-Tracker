# Netlify config — pure static site, no build step.
#
# We deliberately do NOT have a `/* -> /index.html` rewrite:
#   1) The app uses HASH routing (#dashboard, #history, ...) — server-side
#      deep-link fallback is unnecessary.
#   2) Eliminating the rewrite removes any chance of an asset request being
#      served as index.html with status 200, which is the classic "blank
#      page" failure mode on Netlify when the rewrite is too greedy.

[build]
  publish = "."
  # Eighteen guardrails, all pure-Node and fast:
  #   check-netlify-config — THIS file is shaped the way Netlify's schema
  #                          requires (see the note on the scheduled function
  #                          below), every scheduled function it names exists,
  #                          every guard in this list is actually wired in, CI
  #                          runs the same suite, and every env var the
  #                          functions read appears in the README's install table
  #   check-sw-shell      — every sw.js SHELL entry exists on disk
  #   check-image-hygiene — the roster-OCR code has no way to persist the photo
  #   check-boot-payload  — the boot path stays the shell and the arithmetic:
  #                         the static import closure from index.html is pinned
  #                         by name and by size (Tesco Pay's screen, reader and
  #                         workbook importer are ~240 KB of it, deferred to the
  #                         first #tesco visit), every lazy import() resolves,
  #                         and everything the app loads is in the offline shell
  #   check-csp-hashes    — every inline boot script is hashed in the CSP below
  #                         (a miss is invisible locally: no CSP is sent there)
  #   check-freshness     — a deploy always reaches the device: every app asset
  #                         revalidates, the worker stays network-first, and no
  #                         404 rule can match a file the app itself loads
  #   check-icon-refs     — every icon name app.js looks up exists in the map it
  #                         reads (`$` drops a non-string `innerHTML` in silence,
  #                         so a miss renders an empty element, not an error:
  #                         the header's admin circle shipped blank that way)
  #   check-app-shell     — an installed copy behaves like an app rather than a
  #                         page in a window: the manifest identifies it and
  #                         every icon/screenshot it names is really there at
  #                         the size it claims, a launcher shortcut and the
  #                         share target point at routes the router still has
  #                         (checked against seed.js's own TABS), Android's back
  #                         gesture closes the top sheet without ever dismissing
  #                         the lock, and the page cannot be pull-to-refreshed
  #   check-a11y          — the accessibility audit is a browser page
  #                         (a11y-harness.html), so this is what stops it doing
  #                         nothing: every route/menu level/menu modal must still
  #                         be a surface the harness drives, its verdict must
  #                         still sum all four defects, the page must stay
  #                         dev-only, and no icon-only control may go unnamed
  #                         (the History month chevrons shipped that way)
  #   test-tesco          — the pay/tax engine still matches the workbook's
  #                         own cached figures, so a pay change can't ship silently
  #   test-sync           — the sync contract still round-trips the full state
  #                         (stubbed GitHub API; no network, no token)
  #   test-cloud          — the document store is Blobs-primary with a GitHub
  #                         mirror: reads migrate, the version token decides
  #                         conflicts, a failed mirror can't fail a save
  #   test-profiles       — profiles stay isolated: every storage key is
  #                         namespaced, a delete removes all of them, and a
  #                         profile's cloud password never falls back to the
  #                         default one
  #   test-integrity      — the storage/merge paths cannot lose, corrupt or
  #                         resurrect data on hostile input
  #   test-reminder-push  — the push payload still matches the RFC 8291 vector,
  #                         so a reminder can't silently stop being decryptable;
  #                         the signing pair is used only when it really is a
  #                         pair (a swapped one would otherwise be served as
  #                         public), a derived pair actually signs, and the key
  #                         the endpoint advertises is the key the sender signs
  #                         with — the two must never drift apart
  #   test-motion         — a headline figure counts only when it changed and
  #                         rests on the exact total rather than an animation
  #                         frame; a route change renders and waits on nothing
  #                         (no view transition, no entrance animation, and the
  #                         CSS for either cannot come back); every chart mark is
  #                         covered by a tooltip (app.js's browser-free surface,
  #                         lifted out of the file's own text)
  #   test-ui-libs        — the three vendored UI libraries (Fuse, focus-trap +
  #                         tabbable, SheetJS) still do what the app assumes: the
  #                         search RANKS through the vendored Fuse itself, the
  #                         field stays live without it, the focus trap keeps its
  #                         load order and its Escape rules, and every vendor/
  #                         path the code names resolves on disk
  #   check-mobile-layout — a figure cannot leave the box it is drawn in: a stat
  #                         card's value arrives already formatted and at a size
  #                         its own length chose, the card and the value can
  #                         neither push their track wider nor spill it, and the
  #                         six dock tabs compress instead of hanging off the
  #                         screen edge (the failure found on the Insights
  #                         screen at a phone width)
  command = "node scripts/check-netlify-config.mjs && node scripts/check-sw-shell.mjs && node scripts/check-image-hygiene.mjs && node scripts/check-csp-hashes.mjs && node scripts/check-freshness.mjs && node scripts/check-icon-refs.mjs && node scripts/check-boot-payload.mjs && node scripts/check-app-shell.mjs && node scripts/check-a11y.mjs && node scripts/check-mobile-layout.mjs && node scripts/check-css-tokens.mjs && node scripts/test-integrity.mjs && node scripts/test-profiles.mjs && node scripts/test-tesco.mjs && node scripts/test-sync.mjs && node scripts/test-cloud.mjs && node scripts/test-reminder-push.mjs && node scripts/test-motion.mjs && node scripts/test-ui-libs.mjs"

  # Pin the build runtime. scripts/test-tesco.mjs imports tesco.js — a plain
  # .js browser module, and this repo has no package.json (no-build model), so
  # it is ESM by syntax detection only. Node 18 parses it as CommonJS and dies
  # with "Cannot use import statement outside a module", which would fail the
  # build and block the deploy. Detection is on by default from Node 22.7 and
  # 20.19, so pin 22 rather than inherit whatever the site default is.
  #
  # This table must come AFTER `command`: opening any sub-table ends the parent
  # table, so `command` above would otherwise land inside `environment` — and
  # Netlify, seeing no build command, would skip the guards silently.
  [build.environment]
    NODE_VERSION = "22"

# Scheduled function: the daily-reminder push dispatcher. Runs every MINUTE
# in UTC (one-minute cron is supported on every Netlify plan); each
# subscription carries its own IANA zone + HH:MM, and the sender fires when a
# record's local time falls inside its look-back window — a reminder arrives
# at its hour instead of up to a quarter-hour late on the next 15-minute tick
# (see netlify/functions/reminders-send.mjs).
#
# SHAPE MATTERS: `[functions."<name>"]` is a TABLE. The array form
# `[[functions]] name = "..."` is rejected by Netlify while it parses this
# file — before any build step runs — with "Configuration property functions
# must be an object", so no predeploy guard can ever report it: the only
# signal is a failed production deploy. check-netlify-config.mjs now guards
# this exact mistake, and every other shape here that Netlify would take
# silently.
[functions."reminders-send"]
  schedule = "* * * * *"

# `publish = "."` is what keeps this a zero-build site — and it also means the
# deploy serves everything in the repo. The repository is private; the site is
# not, so without these rules the guard scripts, the sync proxy's source (its
# validation logic and env var names) and the docs are all downloadable.
#
# `force = true` is required: Netlify prefers an existing file over a redirect
# otherwise, and every path here IS an existing file. `to` names a page we
# deliberately do not ship, so Netlify answers with its own 404 body and the
# catch-all security headers. check-freshness.mjs asserts that no rule here can
# match a file the app loads, so this can never black-hole the app itself.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

# The docs, one rule each — deliberately NOT a `*.md` glob. A redirect path
# takes an asterisk only as a trailing splat, so the `from = "/*.md"` rule that
# stood here matched nothing and the live site served these three with a 200.
# (The [[headers]] globs below are another engine and do accept a mid-path `*`:
# `/*.js` is what puts no-cache on /vendor/sweetalert2.min.js.) check-freshness
# now fails the build when a published doc has no rule.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vendor/README.md"
  to = "/404.html"
  status = 404
  force = true

# README imagery. Nothing the app loads references it (the README itself is
# 404'd), so it has no reason to be downloadable — and with `publish = "."` it
# was, which is the same "everything ships unless a rule says otherwise" gap
# the rules above close. check-freshness now fails the build for any other
# published file that is neither an app asset nor covered by a 404 rule.
[[redirects]]
  from = "/screenshots/*"
  to = "/404.html"
  status = 404
  force = true

# The local dev server script, the Lidl receipt spike, the Tesco gift-card
# spike, and the roster OCR harness: all four are run on a laptop and have no
# business being downloadable.
[[redirects]]
  from = "/serve.sh"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lidl-spike.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ocr-harness.html"
  to = "/404.html"
  status = 404
  force = true

# The accessibility harness: it drives the real app in an iframe, so it is a
# laptop tool like the roster harness above and never part of the deploy.
[[redirects]]
  from = "/a11y-harness.html"
  to = "/404.html"
  status = 404
  force = true

# Multiple `[[headers]]` blocks (note the DOUBLE brackets — this is TOML
# array-of-tables form) so each rule stands on its own. Single `[headers]`
# is "extend this table" — last declaration wins, and we lose every other rule.
#
# Explicit Content-Type + Cache-Control on every asset. Defense in depth:
#   * `charset=utf-8` prevents CDN/browser combos from falling back to
#     Latin-1 — the codebase has many multi-byte UTF-8 characters
#     (minus signs, arrows, dots) and the failure is silent (parse fail
#     on first Unicode literal, body stays empty).
#   * `no-cache, must-revalidate` means the browser always checks back,
#     so a redeploy is never masked by a stale cached copy.
#   * `X-Content-Type-Options: nosniff` keeps the browser from MIME-sniffing
#     and interpreting our `.js` as HTML by accident.

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# /.well-known/ is the one dot-directory a CDN does serve, and it is the only
# place a Digital Asset Links file can live. Rule and comment both exist now
# because the file does not (yet): shipping an app package needs an
# assetlinks.json at this exact path, and the failure without one is silent —
# an unverified app opens as a plain browser tab with a URL bar instead of as
# the installed app, which reads as a bug rather than a missing file. The
# content type is not optional (Google's verifier rejects a file served as
# text/plain), and revalidating rather than caching means a corrected signing
# fingerprint takes effect on the next fetch instead of on the next day — the
# same reason every other asset here revalidates. check-freshness.mjs now walks
# this directory instead of skipping every dot-entry, so a file dropped in here
# is held to that rule rather than to the platform default.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Self-hosted fonts (see @font-face in styles.css). Covered explicitly rather
# than left to the platform default: this is the class of file a browser will
# happily keep for a year if nothing says otherwise, and a stale font is
# invisible until it is the wrong glyph.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# The roster-OCR language model. Explicit Content-Type for the same reason as
# the wasm rule below, and no-cache so a model swap is never masked: the 2.9 MB
# revalidates as a cheap 304 rather than being re-downloaded.
[[headers]]
  for = "/vendor/tesseract/*.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# WebAssembly core for the roster OCR. `Content-Type: application/wasm` is not
# cosmetic: the browser's streaming compiler refuses a mislabelled response
# ("Incorrect response MIME type. Expected 'application/wasm'"), and Netlify's
# extension table is not something to bet the OCR on. no-cache for the same
# reason as every other asset: a redeploy must never be masked by a stale copy.
[[headers]]
  for = "/vendor/tesseract/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Web App Manifest — Chrome expects a JSON MIME type before it treats the
# site as installable; Netlify's default for .json would also work, but be
# explicit so the PWA signal can never be missed.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# PWA install icons — same no-cache model as the other assets, so a regenerated
# icon is never masked by a stale cached copy.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Catch-all: only generic safety headers, no Cache-Control (each specific
# rule above already owns that for the paths it covers, and we don't want
# duplicate Cache-Control values to fight over the response).
#
# Security headers:
#   * X-Frame-Options + frame-ancestors 'none' — the app must never be
#     iframed (clickjacking the PIN pad or destructive actions).
#   * Content-Security-Policy — default-deny with allowances for the app's
#     real needs. script-src carries SHA-256 hashes of the five inline boot
#     scripts in index.html (theme init, chrome sync, SW register, boot-fail
#     diagnostic, splash removal); if you edit any of those scripts you MUST
#     re-hash them or the app will fail to boot. 'unsafe-inline' is limited
#     to styles (the UI sets style attributes dynamically). connect-src
#     allows any https endpoint because the sync proxy can be self-hosted
#     on a custom domain; localhost is allowed for local development.
#     'wasm-unsafe-eval' is required by the Tesco Pay roster OCR: the vendored
#     tesseract.js core ships WebAssembly, and Chrome refuses to instantiate
#     it without this. It permits WASM compilation only — still no string-eval
#     — and every byte it loads comes from /vendor/tesseract on this origin.
#   * Cross-Origin-Opener-Policy + Cross-Origin-Resource-Policy — this origin
#     opens nothing and shares nothing.
#   * Permissions-Policy — every powerful feature the app never uses is denied
#     outright (no microphone, geolocation, payments, sensors, USB/serial/HID,
#     screen capture, ad-tech topics/attribution). camera stays (self) because
#     the Tesco roster reader offers a live capture path; clipboard stays at
#     its default because the Data menu copies export links.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), display-capture=(), screen-wake-lock=(), browsing-topics=(), attribution-reporting=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-rQpWdpfO3jew1iL5zZ98vGEJgNo+qkd+3CxRBjXKHX0=' 'sha256-D2LzLLViPue4ETfCdLrasOjw6uXTHzgIw0+qHJWBrQY=' 'sha256-dtIg9U8JSsmLRDU6OgsK4CDDi2w92H8NwG52SeuprU0=' 'sha256-ZL/v8fWbS7Fj5A65sCiiFXqwLIgSYaIPlzRmrBe3qYc=' 'sha256-Tcie8lUtWw9EUeiQ+I8ykdJCQwFFJC8hxZPGmniSwLA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self'; connect-src 'self' https: http://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
